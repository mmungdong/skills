<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{document_title}}</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --brand: #174b72;
      --brand-strong: #0f3554;
      --brand-soft: #eaf4fa;
      --accent: #16a085;
      --surface: #ffffff;
      --surface-subtle: #f7f9fc;
      --line: #d8dee9;
      --line-strong: #b7c1cf;
      --high: #c2413b;
      --high-soft: #fff7f6;
      --medium: #b86b12;
      --medium-soft: #fff8ed;
      --low: #287596;
      --low-soft: #f1f8fb;
      --shadow: 0 10px 30px rgba(23, 32, 51, 0.07);
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 20px; }
    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 85% 5%, #dfeef6 0, #eef3f7 35%, #e8edf2 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.65;
    }
    a { color: inherit; }
    a:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(36, 74, 117, 0.35);
      outline-offset: 3px;
      border-radius: 4px;
    }
    .skip-link {
      position: fixed;
      left: 16px;
      top: -80px;
      z-index: 30;
      padding: 10px 14px;
      color: #fff;
      background: var(--brand);
      border-radius: 6px;
      text-decoration: none;
    }
    .skip-link:focus { top: 12px; }
    .report-shell {
      display: grid;
      grid-template-columns: 224px minmax(0, 1080px);
      gap: 28px;
      align-items: start;
      justify-content: center;
      padding: 28px;
    }
    .report-catalog {
      position: sticky;
      top: 24px;
      max-height: calc(100vh - 48px);
      overflow: auto;
      padding: 18px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .catalog-title {
      margin: 0 8px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .report-catalog ol { margin: 0; padding: 0; list-style: none; counter-reset: report-section; }
    .report-catalog li { margin: 2px 0; counter-increment: report-section; }
    .report-catalog a {
      display: grid;
      grid-template-columns: 2.1em 1fr;
      gap: 5px;
      min-height: 40px;
      align-items: center;
      padding: 7px 8px;
      color: #344054;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.35;
      transition: color 160ms ease, background-color 160ms ease;
    }
    .report-catalog a::before {
      content: counter(report-section, decimal-leading-zero);
      color: #8792a2;
      font-variant-numeric: tabular-nums;
    }
    .report-catalog a:hover, .report-catalog a:focus-visible {
      color: var(--brand);
      background: var(--brand-soft);
    }
    .report-page {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    main { max-width: 1080px; margin: 0 auto; padding: 34px 42px 56px; }
    header, main > section, main > details, footer { scroll-margin-top: 24px; }
    h1 { margin: 0 0 8px; color: #fff; font-size: 30px; line-height: 1.3; letter-spacing: 0.01em; }
    h2 {
      margin: 38px 0 16px;
      padding: 0 0 9px;
      color: #173b62;
      border-bottom: 2px solid #9cb3cb;
      font-size: 20px;
      line-height: 1.35;
    }
    h3 { margin: 0 0 8px; color: #203b59; font-size: 17px; }
    h4 { margin: 16px 0 8px; color: #526174; font-size: 13px; }
    section { margin-bottom: 22px; }
    p { margin: 8px 0; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 10px 0 16px; }
    th, td {
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
      font-size: 13px;
    }
    tr > :first-child { border-left: 1px solid var(--line); }
    thead tr:first-child > *, tbody:first-child tr:first-child > * { border-top: 1px solid var(--line); }
    thead th { color: #344054; background: #edf2f7; font-weight: 700; }
    table.kv th { width: 128px; color: #475467; background: var(--surface-subtle); }
    tbody tr:nth-child(even) td { background: #fbfcfe; }
    .readable-status { display: inline-block; min-width: 1.5em; text-align: center; font-size: 17px; font-weight: 800; }
    .readable-status.is-readable { color: #14804a; }
    .readable-status.is-unreadable { color: #b42318; }
    .table-scroll { max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
    ul { margin: 8px 0; padding-left: 20px; }
    li { margin: 5px 0; break-inside: avoid; }
    .issue-card {
      padding: 17px 18px;
      margin: 18px 0;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 5px solid var(--line-strong);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
      break-inside: auto;
    }
    .issue-card.sev-high { border-left-color: var(--high); }
    .issue-card.sev-medium { border-left-color: var(--medium); }
    .issue-card.sev-low { border-left-color: var(--low); }
    .issue-title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 12px; }
    .issue-title-row h3 { flex: 1 1 320px; margin-bottom: 0; }
    .ai-only-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 10px;
      color: #075985;
      background: #e9f7fb;
      border: 1px solid #9fd3e3;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .ai-only-note { margin: 9px 0 6px; padding: 8px 11px; color: #28576d; background: #f0f9fc; border-left: 3px solid #2290ad; border-radius: 5px; font-size: 13px; }
    .ai-only-summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 14px 16px; margin: 0 0 18px; background: #f0f9fc; border: 1px solid #b8deea; border-radius: 10px; }
    .ai-only-summary-head { display: flex; align-items: baseline; gap: 10px; color: #174b72; font-weight: 800; }
    .ai-only-total { display: inline-flex; align-items: baseline; gap: 3px; color: #075985; }
    .ai-only-total strong { font-size: 25px; line-height: 1; font-variant-numeric: tabular-nums; }
    .ai-only-severity-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .ai-only-severity { display: inline-flex; align-items: center; gap: 7px; min-width: 62px; padding: 5px 9px; background: #fff; border: 1px solid var(--line); border-radius: 7px; }
    .ai-only-severity strong { font-variant-numeric: tabular-nums; }
    .ai-only-severity.sev-high { color: var(--high); border-color: #edbfbc; }
    .ai-only-severity.sev-medium { color: #955307; border-color: #efd2aa; }
    .ai-only-severity.sev-low { color: var(--low); border-color: #b9d9e6; }
    .issue-meta { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0 10px; }
    .issue-meta span, .stage li span { margin-right: 10px; }
    .issue-meta .severity-label {
      padding: 1px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .meta-chip { padding: 3px 9px; background: #f5f7fa; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; }
    .issue-location-panel { margin: 11px 0 0; padding: 12px 13px; background: var(--brand-soft); border: 1px solid #b9cde1; border-left: 4px solid var(--brand); border-radius: 8px; }
    .issue-location-heading { margin: 0; color: var(--brand-strong); font-size: 13px; font-weight: 700; }
    .issue-location-summary { margin: 5px 0 0; color: #243b53; font-weight: 700; }
    .issue-location-list { margin: 8px 0 0; padding: 0; list-style: none; }
    .issue-location-list li { display: grid; grid-template-columns: minmax(0, .8fr) auto minmax(0, 1.2fr); gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid rgba(23, 75, 114, 0.16); }
    .location-file { color: var(--brand-strong); font-weight: 700; }
    .location-arrow { color: var(--muted); }
    .location-locator { overflow-wrap: anywhere; }
    .issue-review-status { padding: 9px 12px; color: var(--brand-strong); background: var(--brand-soft); border-radius: 7px; }
    .action-panel { padding: 10px 13px; background: #f4faf8; border: 1px solid #c9e7df; border-radius: 8px; }
    .issue-edits { margin: 12px 0; border-color: #badbd3; background: #f4faf8; }
    .issue-edits > summary { color: #176653; }
    .issue-edits > summary::after { color: #176653; border-color: #9fcfc3; }
    .issue-edits .action-panel { padding: 4px 0 0; margin: 0; border: 0; background: transparent; }
    .issue-edits .action-panel h4 { margin-top: 8px; }
    .sev-high .severity-label { color: var(--high); background: var(--high-soft); border-color: #edbfbc; }
    .sev-medium .severity-label { color: #955307; background: var(--medium-soft); border-color: #efd2aa; }
    .sev-low .severity-label { color: var(--low); background: var(--low-soft); border-color: #b9d9e6; }
    .issue-id, .rule-id, .file, .locator, .kb-path, .exported-at, .role { color: var(--muted); }
    .quote, .excerpt { font-style: italic; }
    .problem-label { margin-right: 6px; color: #344054; font-weight: 700; }
    .problem { padding: 10px 13px; margin: 10px 0 0; background: #f7f9fc; border: 1px solid var(--line); border-radius: 8px; }
    .problem-headline { margin: 4px 0 0; color: #1d2939; font-size: 15px; font-weight: 700; line-height: 1.6; }
    .problem-details { margin: 6px 0 0; padding-left: 20px; color: #344054; font-size: 13px; line-height: 1.75; }
    .problem-details li { margin: 3px 0; }
    .empty { margin: 8px 0; padding: 10px 12px; color: var(--muted); background: var(--surface-subtle); border-radius: 6px; }
    .rule-map { padding: 2px 16px 12px; background: var(--surface-subtle); border: 1px solid var(--line); border-radius: 8px; }
    .rule-map h4 { margin-top: 14px; }
    .banner {
      padding: 12px 14px;
      color: #7d231f;
      background: var(--high-soft);
      border: 1px solid #dcaaa7;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
    }
    details {
      padding: 12px 14px;
      margin: 18px 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface-subtle);
    }
    summary { min-height: 40px; cursor: pointer; color: #174b72; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "展开 ↓"; margin-left: auto; padding: 4px 9px; color: var(--brand); background: #fff; border: 1px solid #aac7da; border-radius: 999px; font-size: 12px; }
    details[open] > summary::after { content: "收起 ↑"; }
    #project-info { margin: -34px -42px 0; padding: 34px 42px 28px; color: #eaf3f8; background: linear-gradient(135deg, var(--brand-strong), var(--brand) 60%, #247b87); border-radius: 12px 12px 0 0; }
    #project-info .badge { margin-bottom: 0; color: #eff8fc; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); }
    .project-line { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 8px 0 12px; }
    .project-line span { color: #d9eaf3; }
    .project-details { margin: 12px 0 0; color: var(--ink); background: rgba(255,255,255,.96); }
    #summary { padding: 22px; margin: 0 -2px 24px; background: #f7fbfd; border: 1px solid #d6e5ee; border-radius: 0 0 12px 12px; }
    #summary h2 { margin-top: 0; }
    .summary-kpis, .review-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
    .metric-card { min-width: 0; padding: 13px 14px; background: #fff; border: 1px solid var(--line); border-top: 3px solid #aab5c2; border-radius: 10px; }
    .metric-card span { display: block; color: var(--muted); font-size: 12px; }
    .metric-card strong { display: block; margin-top: 3px; color: var(--ink); font-size: 23px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .metric-link { color: inherit; text-decoration: none; transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease; }
    .metric-link:hover { transform: translateY(-2px); border-color: var(--brand); box-shadow: 0 7px 18px rgba(23, 75, 114, 0.12); }
    .metric-link:focus-visible { outline: 3px solid rgba(36, 74, 117, 0.35); outline-offset: 3px; }
    .metric-card.primary { border-top-color: var(--brand); }
    .metric-card.good { border-top-color: var(--accent); }
    .metric-card.warning { border-top-color: var(--medium); }
    .metric-card.danger { border-top-color: var(--high); }
    .summary-action-digest { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
    .summary-action-group { padding: 13px 14px; background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--line-strong); border-radius: 9px; }
    .summary-action-group.priority { border-top-color: var(--high); }
    .summary-action-group.manual { border-top-color: var(--medium); }
    .summary-action-group h3 { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
    .summary-action-group h3 strong { font-size: 19px; font-variant-numeric: tabular-nums; }
    .summary-action-group ul { margin-bottom: 0; }
    .summary-action-group li { font-size: 13px; }
    .summary-narrative-details { margin: 12px 0 0; }
    .formula { padding: 10px 12px; color: #445468; background: #f3f6f9; border-left: 3px solid #8aa6bc; border-radius: 6px; font-size: 13px; }
    .closure-alert { padding: 13px 14px; color: #8a231f; background: var(--high-soft); border: 1px solid #e1aaa7; border-radius: 8px; }
    .review-file-list { padding: 0; list-style: none; counter-reset: none; }
    .review-file-list li { display: grid; grid-template-columns: 32px minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .review-file-list .order { display: grid; place-items: center; width: 26px; height: 26px; color: #fff; background: var(--brand); border-radius: 50%; }
    .review-level { padding: 14px; background: #fbfcfe; border: 1px solid var(--line); border-radius: 10px; }
    .level-summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .level-summary span { padding: 5px 9px; background: #fff; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
    .review-item { margin: 14px 0; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    .review-item-unclosed { border-left: 4px solid var(--high); background: var(--high-soft); }
    .score-hero { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 12px; }
    .score-hero div { padding: 18px; color: #fff; background: linear-gradient(135deg, var(--brand-strong), var(--brand)); border-radius: 10px; }
    .score-hero span, .score-hero strong { display: block; }
    .score-hero strong { margin-top: 4px; font-size: 30px; }
    .footer-meta { color: var(--muted); font-size: 12px; }
    .badge {
      display: inline-block;
      padding: 4px 9px;
      margin: 0 6px 12px 0;
      color: #31506f;
      background: var(--brand-soft);
      border: 1px solid #b9cde1;
      border-radius: 999px;
      font-size: 12px;
    }

    @media (max-width: 960px) {
      body { background: var(--surface); }
      .report-shell { display: block; padding: 0; }
      .report-catalog {
        position: static;
        max-height: none;
        padding: 12px 14px;
        border-width: 0 0 1px;
        border-radius: 0;
        box-shadow: none;
      }
      .report-catalog ol { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
      .report-catalog li { flex: 0 0 auto; }
      .report-catalog a { min-height: 44px; padding-inline: 10px; }
      .report-page { border: 0; border-radius: 0; box-shadow: none; }
      main { padding: 28px 22px 44px; }
      #project-info { margin: -28px -22px 0; padding: 28px 22px 24px; border-radius: 0; }
      .summary-kpis, .review-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-action-digest { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      body { font-size: 16px; }
      main { padding-inline: 16px; }
      h1 { font-size: 24px; }
      h2 { margin-top: 32px; font-size: 19px; }
      th, td { padding: 8px; font-size: 12px; }
      table.kv th { width: 104px; }
      .issue-card { padding: 14px; }
      .issue-location-list li { grid-template-columns: 1fr; gap: 2px; }
      .location-arrow { display: none; }
      .summary-kpis, .review-kpis, .score-hero { grid-template-columns: 1fr; }
      .review-file-list li { grid-template-columns: 30px minmax(0, 1fr); }
      .review-file-list li span:last-child, .review-file-list li span:nth-last-child(2) { grid-column: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .report-catalog a { transition: none; }
    }

    @media print {
      @page { size: A4; margin: 16mm 15mm 18mm; }
      body { background: #fff; color: #000; font-size: 10pt; }
      .skip-link, .report-catalog { display: none; }
      .report-shell, .report-page { display: block; padding: 0; border: 0; box-shadow: none; }
      main { max-width: none; padding: 0; }
      h2 { color: #000; border-bottom-color: #555; }
      details { border: none; padding: 0; background: #fff; }
      details > summary { display: none; }
      details:not([open]) > *:not(summary) { display: block; }
      .issue-edits .action-panel { padding: 0; }
      .issue-card { box-shadow: none; break-inside: auto; }
      .issue-location-panel { background: #fff; border-color: #777; break-inside: avoid; }
      .problem { background: #fff; break-inside: avoid; }
      .issue-card.sev-high, .issue-card.sev-medium, .issue-card.sev-low { background: #fff; }
      thead { display: table-header-group; }
      th, td { border-color: #777; }
      .table-scroll { overflow: visible; }
      .summary-kpis, .review-kpis { grid-template-columns: repeat(5, 1fr); }
      .metric-card { padding: 7px; }
      .metric-link { color: #000; text-decoration: none; box-shadow: none; }
      .summary-action-digest { grid-template-columns: repeat(3, 1fr); }
      a[href]:after { content: ""; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#audit-report">跳至审核正文</a>
  <div class="report-shell">
    <nav class="report-catalog" aria-label="报告目录">
      <p class="catalog-title">报告目录</p>
      <ol>
        <li><a href="#project-info">AI 审核总结</a></li>
        <li><a href="#summary">审核结论概览</a></li>
        <li><a href="#actionable-issues">AI 检出问题</a></li>
        <li><a href="#manual-confirmation-items">人工确认事项</a></li>
        <li><a href="#external-data-verification">AI 外部核验</a></li>
        <li><a href="#review-comparison">人工复核对照</a></li>
        <li><a href="#ai-scorecard">AI 表现评分卡</a></li>
        <li><a href="#audit-basis">本次审核依据</a></li>
        <li><a href="#scope-and-not-checked">范围与未检查项</a></li>
        <li><a href="#professional-trail">专业审核轨迹</a></li>
        <li><a href="#file-trace">文件追溯信息</a></li>
      </ol>
    </nav>
    <div class="report-page">
{{report_content}}
    </div>
  </div>
  <script id="audit-result" type="application/json">{{embedded_json}}</script>
</body>
</html>
